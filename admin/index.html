<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Prima16 Admin</title>
<link rel="stylesheet" href="/css/brand.css">
</head>
<body>
<div class="wrap">
  <nav class="top"><div class="mark">Prima16 Admin</div><button class="btn ghost" id="out" type="button">Изход</button></nav>
  <div id="login">
    <h1>Вход</h1>
    <p class="lead">Парола: Vercel env ADMIN_PASSWORD.</p>
    <p><input id="pw" type="password" autocomplete="current-password" placeholder="Парола"></p>
    <p><button class="btn" id="go" type="button">Влез</button></p>
    <p id="err" style="color:var(--bad)"></p>
  </div>
  <div id="dash" hidden>
    <h1>Състояние</h1>
    <p class="lead" id="stamp"></p>
    <article class="card" id="next-card">
      <div class="tag">Следващо за пари</div>
      <h2>Какво да направя сега</h2>
      <div id="next"></div>
    </article>
    <article class="card"><div class="tag">URL</div><h2>Здраве</h2><div id="health"></div></article>
    <article class="card"><div class="tag">Продукти</div><h2>Каталог</h2><div id="products"></div></article>
    <article class="card">
      <div class="tag">Каса</div>
      <h2>Приходи</h2>
      <div id="money"></div>
      <p>
        <a href="https://whop.com/dashboard/biz_7dpwuua5eEX7UJ/" target="_blank" rel="noopener">Whop</a> ·
        <a href="https://gumroad.com/login" target="_blank" rel="noopener">Gumroad</a>
      </p>
    </article>
    <article class="card">
      <div class="tag">Данни</div>
      <h2>Недостъпни метрики</h2>
      <div id="missing"></div>
    </article>
  </div>
</div>
<script src="/admin/app.js"></script>
</body>
</html>
